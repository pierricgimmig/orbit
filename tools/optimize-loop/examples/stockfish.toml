# Stockfish as an optimize-loop target. Clone it out of tree
# (git clone https://github.com/official-stockfish/Stockfish ~/git/stockfish);
# the bench script pins to one performance core and fingerprints the *whole*
# bench output, so only a bit-exact change can be accepted.
name = "stockfish"
project = "~/git/stockfish"

[build]
# clean first: an incremental build across variants (flags, PGO) links stale objects
command = ["sh", "-c", "make -C src clean >/dev/null && make -C src -j16 build ARCH=native COMP=gcc"]
workdir = "."
timeout_sec = 1800

[bench]
command = ["tools/optimize-loop/examples/stockfish-bench.sh"]
repeat = 10
timeout_sec = 120

[bench.metric]
regex = 'ORBIT_METRIC\s+throughput=(?P<value>[-+0-9.eE]+)'
name = "nps"
unit = "nodes_per_sec"

[correctness]
command = ["tools/optimize-loop/examples/stockfish-bench.sh"]
expect_returncode = 0

[capture]
command = ["sh", "-c", "cd ~/git/stockfish/src && exec ./stockfish bench 256 4 22"]
duration_ms = 8000
