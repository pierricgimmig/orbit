<!doctype html>
<html lang="en">
<head>
<script>try{var t=localStorage.getItem("orbit-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="{{root}}/favicon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{root}}/site.css">
</head>
<body>
{{nav}}

{{toc}}

{{body}}
</main>
</div>
<footer class="site"><span>Orbit</span><a href="{{root}}/index.html">Home</a><a href="{{root}}/features.html">Features</a><a href="{{root}}/manual/index.html">Manual</a></footer>
<script src="{{root}}/clips.js"></script>
<script>(function(){var b=document.getElementById("theme-toggle");if(!b)return;function cur(){return document.documentElement.getAttribute("data-theme")||"light";}function lab(){b.textContent=cur()==="dark"?"Light":"Dark";}lab();b.addEventListener("click",function(){var n=cur()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("orbit-theme",n);}catch(e){}lab();});})();</script>
</body>
</html>
