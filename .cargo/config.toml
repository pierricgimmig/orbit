# Windows: link the C runtime statically, so perfr.exe, the helper,
# the agent DLL and perfr_api.dll depend on nothing but kernel32/ntdll and
# the system DLLs they name -- the Windows reading of "static binary"
# (docs/design/cross-platform-plan.md). It also matches the Frida devkits, which
# are built against the static CRT.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
