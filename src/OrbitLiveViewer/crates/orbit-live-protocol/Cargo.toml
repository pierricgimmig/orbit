[package]
name = "orbit-live-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Binary framing for the Orbit live viewer WebSocket stream"

[dependencies]
orbit-live-event = { path = "../orbit-live-event" }
# Pure-Rust deflate, for the optional compressed batch frame. No C, so the
# service stays a static musl binary and the viewer's WASM inflates it too.
miniz_oxide = "0.8"
serde = { workspace = true }
