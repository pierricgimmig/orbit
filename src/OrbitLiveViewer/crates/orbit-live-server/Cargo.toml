[package]
name = "orbit-live-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HTTP + WebSocket server that serves the live WASM viewer and streams packed events"

[dependencies]
orbit-live-event = { path = "../orbit-live-event" }
orbit-live-protocol = { path = "../orbit-live-protocol" }
orbit-live-render = { path = "../orbit-live-render" }
orbit-live-ring = { path = "../orbit-live-ring" }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tower-http = { version = "0.5.2", features = ["cors"] }

[[bin]]
name = "orbit-live-service"
path = "src/main.rs"
