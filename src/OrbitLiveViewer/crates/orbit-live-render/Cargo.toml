[package]
name = "orbit-live-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pixel-column live-trace rasterizer (O(width * log n) per lane)"

[features]
default = []
# Native rayon lane split. Bazel builds omit this so crate_universe does not
# need a repin; cargo bench/test can pass `--features parallel`.
parallel = ["dep:rayon"]

[dependencies]
orbit-live-event = { path = "../orbit-live-event" }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
clap = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "rasterize"
harness = false
