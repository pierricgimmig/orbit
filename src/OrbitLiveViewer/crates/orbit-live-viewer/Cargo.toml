# Its own workspace, excluded from ../../Cargo.toml. This crate is the wasm32
# cdylib and drags in eframe / wgpu / winit; the service workspace next door is
# what Bazel resolves for liborbit_live_ffi.a and must stay free of that tree.
# ../../rust-toolchain.toml still applies (rustc is picked up by directory).
[workspace]

[package]
name = "orbit-live-viewer"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/pierricgimmig/orbit"
rust-version = "1.88"
description = "eframe WebRunner live viewer: Orbit chrome + hybrid wgpu timeline"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["egui"]
egui = ["dep:eframe", "dep:egui", "dep:egui-wgpu"]

[dependencies]
orbit-live-event = { path = "../orbit-live-event" }
orbit-live-protocol = { path = "../orbit-live-protocol" }
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
console_error_panic_hook = "0.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# eframe 0.32 (MSRV 1.85, wgpu 25). This workspace pins rustc 1.88.
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"], optional = true }
egui = { version = "0.32.3", optional = true }
egui-wgpu = { version = "0.32.3", optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "console",
    "Document",
    "Element",
    "Headers",
    "HtmlCanvasElement",
    "Location",
    "MessageEvent",
    "Performance",
    "RequestInit",
    "Response",
    "WebSocket",
    "Window",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
orbit-live-render = { path = "../orbit-live-render", features = ["parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
orbit-live-render = { path = "../orbit-live-render" }
wasm-bindgen-futures = "=0.4.50"
# WebGPU first, WebGL fallback (egui-wgpu default).
wgpu = { version = "25", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
