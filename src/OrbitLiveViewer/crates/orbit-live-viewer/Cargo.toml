[package]
name = "orbit-live-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WASM live trace viewer: pixel-column rasterizer + optional WebGPU blit"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
webgpu = ["dep:wgpu"]

[dependencies]
orbit-live-event = { path = "../orbit-live-event" }
orbit-live-protocol = { path = "../orbit-live-protocol" }
orbit-live-render = { path = "../orbit-live-render" }
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wgpu = { version = "23.0", default-features = false, features = ["wgsl", "webgpu"], optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "HtmlCanvasElement",
    "Window",
]
