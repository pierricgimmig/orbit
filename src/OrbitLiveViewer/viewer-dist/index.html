<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit Live Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B0C0E; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; outline: none; }
    #fallback {
      display: none; color: #ffffff; font: 13px/1.4 "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      padding: 16px; max-width: 36rem;
    }
    #fallback a { color: #64B5F6; }
  </style>
</head>
<body>
  <canvas id="the_canvas_id" tabindex="0"></canvas>
  <div id="fallback">
    eframe WASM failed to start.
    <a href="fallback.html">Open the last-ditch HTML viewer</a>.
    Rebuild with <code>bazel build //:wasm</code> so
    <code>orbit_live_viewer.js</code> / <code>.wasm</code> are served.
  </div>
  <script type="module">
    const canvas = document.getElementById("the_canvas_id");
    const fallback = document.getElementById("fallback");
    function showFallback(err) {
      console.error(err);
      canvas.style.display = "none";
      fallback.style.display = "block";
    }
    try {
      const mod = await import("./orbit_live_viewer.js");
      await mod.default();
      await mod.start_eframe(canvas);
    } catch (e) {
      showFallback(e);
    }
  </script>
</body>
</html>
