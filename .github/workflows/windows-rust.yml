# The Windows service: the producer crates, the ETW crate (the kernel logger
# for real -- GitHub's Windows runners are elevated), the service, the
# packaged dist, the C/C++ consumers, and the two end-to-end smoke tests
# (manual scopes, Frida hooks). The twin of macos-rust.yml and frida-rust.yml.
name: windows-rust

on:
  push:
    branches: [main, rust]
  pull_request:
    branches: [main, rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Test producer crates and the ETW decoders
        run: cargo +1.88.0 test --locked --manifest-path rust/Cargo.toml -p orbit-api -p orbit-scope-ring -p orbit-frida-transport -p orbit-etw
      - name: Test the kernel logger live (the runner is elevated)
        env:
          # Turns the "not elevated" skip into a failure: this job must run it.
          ORBIT_ETW_LIVE: '1'
        run: cargo +1.88.0 test --locked --manifest-path rust/Cargo.toml -p orbit-etw --test live -- --nocapture
      - name: Test service
        run: cargo +1.88.0 test --locked --manifest-path rust/crates/orbit-service/Cargo.toml
      - name: Test Frida helper and agent
        run: |
          .\tools\frida\devkits.ps1
          cargo +1.88.0 test --locked --manifest-path rust/crates/orbit-frida-helper/Cargo.toml
          cargo +1.88.0 test --locked --manifest-path rust/Cargo.toml -p orbit-frida-agent --features native
      - name: Build distributable service and SDK
        run: .\build-service-windows.ps1
      - name: Build and run C and C++ consumers
        env:
          ORBIT_API_LIB: ${{ github.workspace }}\dist\windows\orbit_api.dll
        run: |
          .\src\OrbitTestC\build.ps1
          .\src\OrbitTestCpp\build.ps1
          .\src\OrbitTestC\OrbitTestC.exe --seconds 1
          .\src\OrbitTestCpp\OrbitTestCpp.exe --seconds 1
          .\dist\windows\OrbitTestRust.exe --seconds 1
      - name: Smoke test manual capture and restart
        run: |
          python -m pip install --quiet pyarrow
          python tools/e2e/manual_service_smoke.py --service dist/windows/orbit-service.exe --api-lib dist/windows/orbit_api.dll
      - name: Smoke test Frida hooks
        run: |
          . .\tools\windows\msvc-env.ps1
          New-Item -ItemType Directory -Force rust\target\e2e | Out-Null
          Push-Location rust\target\e2e
          cl.exe /nologo /O1 /Zi /std:c11 /utf-8 /DORBIT_STATIC /I..\..\crates\orbit-api\include ..\..\..\tools\e2e\frida_target.c /Fe:orbit-frida-target.exe /link /DEBUG ..\x86_64-pc-windows-msvc\release\orbit_api.lib ws2_32.lib ntdll.lib userenv.lib bcrypt.lib advapi32.lib kernel32.lib
          Pop-Location
          python tools/e2e/frida_smoke.py --service dist/windows/orbit-service.exe --agent dist/windows/orbit_frida_agent.dll --helper dist/windows/orbit-frida-helper.exe --target rust/target/e2e/orbit-frida-target.exe
          python tools/e2e/frida_smoke.py --service dist/windows/orbit-service.exe --agent dist/windows/orbit_frida_agent.dll --helper dist/windows/orbit-frida-helper.exe --target rust/target/e2e/orbit-frida-target.exe --inflight
      - name: Capture the scheduler and samples with the kernel logger
        run: |
          python tools/e2e/windows_etw_smoke.py --service dist/windows/orbit-service.exe --target dist/windows/OrbitTestRust.exe
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-windows-x86_64
          path: dist/windows/
