name: macos-rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-capture:
    strategy:
      fail-fast: false
      matrix:
        # Explicit architectures: macos-15 is Apple Silicon.
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Test manual API and shared mappings
        run: cargo +1.88.0 test --locked -p orbit-api -p orbit-scope-ring
      - name: Test service
        run: cargo +1.88.0 test --locked -p orbit-service
      - name: Build distributable service and SDK
        run: tools/build/build-service-macos.sh
      - name: Build and run C and C++ consumers
        env:
          ORBIT_API_LIB: ${{ github.workspace }}/dist/macos/liborbit_api.dylib
        run: |
          ./tools/test-programs/OrbitTestC/build.sh
          ./tools/test-programs/OrbitTestCpp/build.sh
          ./tools/test-programs/OrbitTestC/OrbitTestC --seconds 1
          ./tools/test-programs/OrbitTestCpp/OrbitTestCpp --seconds 1
      - name: Smoke test capture and restart
        run: |
          python3 -m venv /tmp/orbit-smoke
          /tmp/orbit-smoke/bin/pip install pyarrow
          /tmp/orbit-smoke/bin/python tools/e2e/manual_service_smoke.py --service dist/macos/orbit-service --api-lib dist/macos/liborbit_api.dylib
      - name: Smoke test two services in one timeline
        run: |
          cargo +1.88.0 build --locked -p orbit-test-rust
          /tmp/orbit-smoke/bin/python tools/e2e/multi_machine_smoke.py --service dist/macos/orbit-service --target target/debug/OrbitTestRust
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.runner }}
          path: dist/macos/
