#
# Builds the pip wheels for Orbit:
#   orbit-api       manual instrumentation for Python (bundles liborbit_api)
#   orbit-profiler  the orbit-service binary + library + header, one command
#
# Both wheels for a platform come from one build (tools/release/build_wheels.sh)
# so the ring protocol matches between the library that writes and the service
# that reads. Wheels are uploaded as artifacts; on a version tag they publish to
# PyPI via Trusted Publishing (configure the publishers on PyPI first).

name: python-wheels
on:
  workflow_dispatch:
  push:
    tags:
    - 'v1.*'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { runner: ubuntu-22.04, key: linux-x86_64 }
        - { runner: ubuntu-22.04, key: linux-aarch64 }
        - { runner: macos-14,     key: macos-arm64 }
        - { runner: macos-14,     key: macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Rust toolchain
      run: |
        rustup toolchain install 1.88.0 --profile minimal
        rustup default 1.88.0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build tooling
      run: pip install cargo-zigbuild ziglang build wheel

    - name: Build wheels
      run: tools/release/build_wheels.sh ${{ matrix.key }}

    - name: Smoke test (Linux only; the runner arch matches x86_64)
      if: matrix.key == 'linux-x86_64'
      run: |
        python -m venv /tmp/v
        /tmp/v/bin/pip install --no-index --find-links dist/wheels orbit-profiler
        env -u ORBIT_API_LIB PATH=/usr/bin:/bin /tmp/v/bin/python -c \
          "import orbit_api as o; assert o.init() == 0 and o.available(); print('ok', o.library_path())"
        /tmp/v/bin/orbit-service --help >/dev/null

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.key }}
        path: dist/wheels/*.whl
        if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing; no API token stored
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: wheels-*
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
