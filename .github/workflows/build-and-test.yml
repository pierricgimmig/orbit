name: build-and-test
on:
  # C++/Bazel CI disabled: the port no longer changes C++, so these
  # builds are manual-only now (run from the Actions tab if ever needed).
  workflow_dispatch:
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  job:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "linux-gcc-fastbuild",
            os: "ubuntu-22.04",
            config_flag: "",
            cc: "gcc",
            cxx: "g++"
        }
        - {
            name: "linux-gcc-opt",
            os: "ubuntu-22.04",
            config_flag: "-c opt",
            cc: "gcc",
            cxx: "g++"
        }
        - {
            name: "linux-clang-fastbuild",
            os: "ubuntu-22.04",
            config_flag: "",
            cc: "clang",
            cxx: "clang++"
        }
        - {
            name: "windows-msvc-opt",
            os: "windows-2022",
            config_flag: "-c opt"
        }
    env:
      # Bazel resolves the C++ toolchain from CC/CXX.
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
      PR_NUMBER: ${{ github.event.number }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - run: |
           mkdir pr_metadata
           echo "$PR_NUMBER" > pr_metadata/pr_number.txt
           echo "$PR_HEAD_REPO" > pr_metadata/pr_head_repo.txt
           echo "$PR_HEAD_REF" > pr_metadata/pr_head_ref.txt
        shell: bash
        if: github.event_name == 'pull_request' && matrix.config.name == 'linux-clang-fastbuild'
      - name: 'Upload PR metadata'
        if: github.event_name == 'pull_request' && matrix.config.name == 'linux-clang-fastbuild'
        uses: actions/upload-artifact@v4
        with:
          name: pr_metadata
          path: pr_metadata
          retention-days: 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      # Everything else - Qt, OpenGL, LLVM, gRPC, capstone, the Rust
      # toolchain - is fetched by Bazel itself. There is nothing to apt-install.
      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ matrix.config.name }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ matrix.config.name }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-
            bazel-${{ matrix.config.name }}-

      - name: Write CI bazelrc
        shell: bash
        run: |
          cat > .bazelrc.user <<'EOF'
          common --announce_rc
          common --color=no
          common --curses=no
          build --disk_cache=~/.cache/bazel-disk
          build --repository_cache=~/.cache/bazel-repo
          build --keep_going
          test --test_output=errors
          test --test_summary=terse
          EOF

      - name: Build
        run: bazel build ${{ matrix.config.config_flag }} //...

      # `integration` drives perf_event_open and ptrace against a live process,
      # which a hosted runner does not permit - the same set the CMake build
      # excluded with `ctest -E IntegrationTest`. `known_flaky` is the one test
      # with an open race; see docs/building_with_bazel.md.
      - name: Test
        run: bazel test ${{ matrix.config.config_flag }} --test_tag_filters=-integration,-known_flaky //...

      - name: Test (known-flaky, non-gating)
        continue-on-error: true
        run: bazel test ${{ matrix.config.config_flag }} --test_tag_filters=known_flaky //...

      - name: Collect test results
        if: success() || failure()
        shell: bash
        run: |
          mkdir -p testresults
          testlogs="$(bazel info bazel-testlogs)"
          find "$testlogs" -name 'test.xml' -print0 |
            while IFS= read -r -d '' f; do
              rel="${f#"$testlogs"/}"
              cp "$f" "testresults/$(echo "${rel%/test.xml}" | tr '/' '_').xml"
            done

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results-${{ matrix.config.name }}
          path: 'testresults/**/*.xml'
          retention-days: 1
