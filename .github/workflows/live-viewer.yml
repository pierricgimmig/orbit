name: live-viewer
on:
  push:
    branches: ['main']
    paths:
      - 'crates/orbit-live-*/**'
      - '.github/workflows/live-viewer.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'crates/orbit-live-*/**'
      - '.github/workflows/live-viewer.yml'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: cargo test (native live-viewer crates)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The seven viewer crates: the server side orbit-service links, the
      # trace importers, and the eframe viewer itself (its tests run natively,
      # no window). The service crates have their own jobs.
      - name: Test the live-viewer crates
        run: >
          cargo test -p orbit-live-event -p orbit-live-ring -p orbit-live-protocol
          -p orbit-live-render -p orbit-live-server -p orbit-live-chrome -p orbit-live-viewer
      - name: Compile eframe WebRunner for wasm32
        run: cargo build -p orbit-live-viewer --target wasm32-unknown-unknown
      - name: Compile benches
        run: cargo bench -p orbit-live-render -p orbit-live-ring --no-run
      # The complexity test is compiled out of debug (`cfg(not(debug_assertions))`).
      # Run it once with optimizations so CI still guards O(width log n).
      - name: Test pixel rasterizer complexity (release)
        run: cargo test -p orbit-live-render --release --lib tests::pixel_prepare_is_not_linear_in_scopes -- --exact
