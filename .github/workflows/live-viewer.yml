name: live-viewer
on:
  push:
    branches: ['main']
    paths:
      - 'src/OrbitLiveViewer/**'
      - '.github/workflows/live-viewer.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'src/OrbitLiveViewer/**'
      - '.github/workflows/live-viewer.yml'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: cargo test (native live-viewer crates)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/OrbitLiveViewer
      - name: Test native crates
        working-directory: src/OrbitLiveViewer
        run: cargo test --workspace --exclude orbit-live-viewer
      - name: Test viewer crate (eframe + callback, no window)
        working-directory: src/OrbitLiveViewer
        run: cargo test -p orbit-live-viewer
      - name: Compile eframe WebRunner for wasm32
        working-directory: src/OrbitLiveViewer
        run: cargo build -p orbit-live-viewer --target wasm32-unknown-unknown
      - name: Compile benches
        working-directory: src/OrbitLiveViewer
        run: cargo bench --workspace --exclude orbit-live-viewer --no-run
