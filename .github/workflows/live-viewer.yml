name: live-viewer
on:
  push:
    branches: ['main']
    paths:
      - 'src/OrbitLiveViewer/**'
      - '.github/workflows/live-viewer.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'src/OrbitLiveViewer/**'
      - '.github/workflows/live-viewer.yml'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: cargo test (native live-viewer crates)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Two workspaces: the service crates Bazel links into OrbitService,
          # and the wasm32 eframe viewer. See src/OrbitLiveViewer/Cargo.toml.
          workspaces: |
            src/OrbitLiveViewer
            src/OrbitLiveViewer/crates/orbit-live-viewer
      - name: Test native crates
        working-directory: src/OrbitLiveViewer
        run: cargo test --workspace
      - name: Test viewer crate (eframe + callback, no window)
        working-directory: src/OrbitLiveViewer/crates/orbit-live-viewer
        run: cargo test
      - name: Compile eframe WebRunner for wasm32
        working-directory: src/OrbitLiveViewer/crates/orbit-live-viewer
        run: cargo build --target wasm32-unknown-unknown
      - name: Compile benches
        working-directory: src/OrbitLiveViewer
        run: cargo bench --workspace --no-run
      # The complexity test is compiled out of debug (`cfg(not(debug_assertions))`).
      # Run it once with optimizations so CI still guards O(width log n).
      - name: Test pixel rasterizer complexity (release)
        working-directory: src/OrbitLiveViewer
        run: cargo test -p orbit-live-render --release --lib pixel_prepare_is_not_linear_in_scopes -- --exact
