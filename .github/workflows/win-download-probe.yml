# Temporary probe: the windows-rust Frida step's devkit download hangs after
# the cargo test steps but is instant on a fresh runner. Which step poisons it?
name: win-download-probe
on:
  push:
    branches: [ci-win-download]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Download after checkout
        timeout-minutes: 3
        run: .\.github\probe\dl.ps1 fresh
      - name: Test producer crates and the ETW decoders
        run: cargo +1.88.0 test --locked --manifest-path rust/Cargo.toml -p orbit-api -p orbit-scope-ring -p orbit-frida-transport -p orbit-etw
      - name: Download after producer tests
        timeout-minutes: 3
        run: .\.github\probe\dl.ps1 producers
      - name: Test the kernel logger live (the runner is elevated)
        env:
          ORBIT_ETW_LIVE: '1'
        run: cargo +1.88.0 test --locked --manifest-path rust/Cargo.toml -p orbit-etw --test live -- --nocapture
      - name: Download after live kernel logger test
        timeout-minutes: 3
        run: .\.github\probe\dl.ps1 etw-live
      - name: Test service
        run: cargo +1.88.0 test --locked --manifest-path rust/crates/orbit-service/Cargo.toml
      - name: Download after service tests
        timeout-minutes: 3
        run: .\.github\probe\dl.ps1 service
      - name: The real devkit script
        timeout-minutes: 5
        continue-on-error: true
        run: .\tools\frida\devkits.ps1
      - name: Download after the devkit script
        timeout-minutes: 3
        run: .\.github\probe\dl.ps1 after-devkits
