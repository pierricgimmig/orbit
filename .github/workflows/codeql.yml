name: "CodeQL"

on:
  schedule:
    - cron: '20 19 * * 1,5'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'python' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'
        submodules: 'recursive'

    - name: Mount Bazel cache
      if: ${{ matrix.language == 'cpp' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel-disk
        key: codeql-bazel-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
        restore-keys: |
          codeql-bazel-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-
          codeql-bazel-

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        
        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # CodeQL's tracer needs to observe the real compiler invocations, so the
    # sandbox is turned off for this build only.
    - name: Bazel Build
      if: ${{ matrix.language == 'cpp' }}
      run: bazel build --spawn_strategy=local --disk_cache=~/.cache/bazel-disk //...

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{matrix.language}}"
