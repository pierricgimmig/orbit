# Legacy C++ Qt UI and C++ OrbitService.
#
# The weekly schedule is disabled so new nightlies stop occupying the top of
# the Releases page. Rust releases are release-rust.yml, tagged orbit-v*
# (never v1.*). A manual run of this workflow is still a prerelease: the
# pinned action has no make_latest input, and a prerelease cannot be
# GitHub's Latest. Existing nightly-* releases are not deleted or retagged.
name: release
on:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-release-archives:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: release-bazel-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            release-bazel-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-
            release-bazel-

      - name: Generate version string
        id: generate-version-string
        run: echo "version_string=$(git describe --always --match 'v1.*')" >> $GITHUB_OUTPUT

      - name: Build
        run: bazel build -c opt --disk_cache=~/.cache/bazel-disk //src/Orbit:Orbit //src/Service:OrbitService

      # The UI ships as its runfiles tree: the binary plus the Qt plugins and
      # qt.conf that `qt_application` stages next to it. OrbitService is a plain
      # binary that only needs the C library on the target.
      - name: Stage archives
        id: stage
        run: |
          set -euo pipefail
          VERSION='${{ steps.generate-version-string.outputs.version_string }}'
          BIN="$(bazel info -c opt bazel-bin)"

          mkdir -p "dist/Orbit-$VERSION"
          cp -rL "$BIN/src/Orbit/Orbit.runfiles/_main/src/Orbit/." "dist/Orbit-$VERSION/"
          tar -C dist -czf "Orbit-$VERSION-linux-x86_64.tar.gz" "Orbit-$VERSION"

          mkdir -p "dist/OrbitService-$VERSION"
          cp -L "$BIN/src/Service/OrbitService" "dist/OrbitService-$VERSION/"
          tar -C dist -czf "OrbitService-$VERSION-linux-x86_64.tar.gz" "OrbitService-$VERSION"

          ls -la ./*.tar.gz

      - name: Generate tag name
        id: generate-tag-name
        run: echo "tag_name=nightly-$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@1e07f4398721186383de40550babbdf2b84acfc5 # v1
        with:
          name: 'Legacy C++ nightly ${{ steps.generate-version-string.outputs.version_string }}'
          body: 'Legacy C++ nightly (Qt Orbit UI and C++ OrbitService). Not the Rust orbit-service. Rust releases are tagged orbit-vX.Y.Z. This stays a prerelease so it is not GitHub Latest.'
          tag_name: ${{ steps.generate-tag-name.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            *.tar.gz
