# Service-side Rust for Orbit. Separate from src/OrbitLiveViewer on purpose:
# these crates parse binaries and kernel data and must not share a lockfile
# with the viewer's eframe/wgpu/tokio tree.
#
# See docs/rust-port-plan.html for the staging, and docs/blog/ for the
# running write-up of what each step cost.

[workspace]
resolver = "2"
members = [
    "crates/orbit-maps",
    "crates/orbit-object",
    "ffi/orbit-maps-ffi",
    "ffi/orbit-object-ffi",
]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/pierricgimmig/orbit"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
