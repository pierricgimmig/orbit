# Service-side Rust for Orbit. Separate from rust/live-viewer on purpose:
# these crates parse binaries and kernel data and must not share a lockfile
# with the viewer's eframe/wgpu/tokio tree.
#
# See docs/rust-port-plan.html for how the C++ service was ported, and
# docs/blog/ for the running write-up of what each step cost. The C++ tree
# itself lives on the `cpp` branch.

[workspace]
resolver = "2"
members = [
    "crates/orbit-frida-transport",
    "crates/orbit-frida-agent",
    "crates/orbit-api",
    "crates/orbit-test-rust",
    "crates/orbit-collector",
    "crates/orbit-etw",
    "crates/orbit-maps",
    "crates/orbit-object",
    "crates/orbit-perf-merge",
    "crates/orbit-perf-records",
    "crates/orbit-perf-ring",
    "crates/orbit-pod-dump",
    "crates/orbit-gpu-helper",
    "crates/orbit-ptrace",
    "crates/orbit-scope-ring",
    "crates/orbit-thread-states",
    "crates/orbit-tracing-state",
    "crates/orbit-trampoline",
    "crates/orbit-unwind",
    "crates/orbit-wire",
]
# orbit-service, orbit-capture and orbit-frida-helper are workspaces of their
# own: they depend on the live-viewer server crates (axum/tokio) to serve the
# UI, whose dependency tree this workspace keeps out of its lockfile.
# live-viewer/ holds the viewer's own workspaces (see live-viewer/Cargo.toml).
exclude = ["crates/orbit-service", "crates/orbit-capture", "crates/orbit-frida-helper", "live-viewer"]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/pierricgimmig/orbit"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# The symbol table stays -- a profiler's own binaries, the service and the
# test apps, must symbolize -- and so does the line table: the code views
# interleave a function's disassembly with its source, which needs
# .debug_line, and the example disassembly is of the service itself.
# Nothing else of DWARF (no .debug_info beyond what the line table needs).
debug = "line-tables-only"
strip = "none"

# The dependencies carry no debug info at all: their line tables were 35 MB
# on the service, for code nobody disassembles from here.
[profile.release.package."*"]
debug = false
