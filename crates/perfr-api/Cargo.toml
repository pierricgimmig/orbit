[package]
name = "perfr-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "perfr manual instrumentation: scopes, instants, links and values on a shared-memory ring a running perfr drains"
keywords = ["profiling", "tracing", "instrumentation", "perfr"]
categories = ["development-tools::profiling"]
include = ["src/**", "include/perfr.h", "README.md"]

# Three shapes of the same library: rlib for Rust callers, staticlib for C and
# C++ to link, cdylib for Python to load with ctypes.
[lib]
name = "perfr_api"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "perfr-scope-dump"
path = "src/bin/perfr-scope-dump.rs"

[[bin]]
name = "perfr-scope"
path = "src/bin/perfr-scope.rs"

[dependencies]
libc = "0.2"
perfr-scope-ring = { path = "../perfr-scope-ring" }
