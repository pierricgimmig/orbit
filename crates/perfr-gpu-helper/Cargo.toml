[package]
name = "perfr-gpu-helper"
version = "0.1.0"
description = "GPU telemetry helper: polls NVML and writes pod events to stdout"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "perfr-gpu-helper"
path = "src/main.rs"

[dependencies]
libc = "0.2"
perfr-tracing-state = { path = "../perfr-tracing-state" }
perfr-wire = { path = "../perfr-wire" }
