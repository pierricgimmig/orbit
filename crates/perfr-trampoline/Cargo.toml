[package]
name = "perfr-trampoline"
version = "0.1.0"
description = "Trampoline placement, instruction relocation and code generation for native hooks"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
perfr-maps = { path = "../perfr-maps" }
perfr-ptrace = { path = "../perfr-ptrace" }
