[package]
name = "perfr-frida-agent"
version = "0.1.0"
description = "The Frida Gum agent loaded into the target: hooks functions and emits scopes through the perfr API"
edition = "2021"
license = "BSD-2-Clause"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1", optional = true }
libc = "0.2"
perfr-api = { path = "../perfr-api" }
perfr-frida-transport = { path = "../perfr-frida-transport" }
perfr-scope-ring = { path = "../perfr-scope-ring" }

[dev-dependencies]
tempfile = "3"

[features]
native = ["dep:serde_json"]

[build-dependencies]
perfr-frida-build = { path = "../perfr-frida-build" }
