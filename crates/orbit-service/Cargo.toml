[package]
name = "orbit-service"
version = "0.1.0"
description = "The Orbit capture service: samples, traces and hooks a process and serves the live viewer"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/pierricgimmig/orbit"
rust-version = "1.88"

[[bin]]
name = "orbit-service"
path = "src/main.rs"

[dependencies]
tempfile = "3"
# The log facade; logging.rs is the one implementation (stderr and a file).
log = "0.4"
orbit-frida-transport = { path = "../orbit-frida-transport" }
# Pure Rust; already in the tree through orbit-capture. Used by the wire bench only.
miniz_oxide = "0.8"
# The disassembler behind the code views (pure Rust); the trampoline crate
# already carries it.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }
orbit-api = { path = "../orbit-api" }
orbit-capture = { path = "../orbit-capture" }
orbit-live-event = { path = "../orbit-live-event" }
orbit-live-server = { path = "../orbit-live-server" }
# Rust's own demangler: std-only, one crate, no deps. C++ names stay mangled here (blog post 02).
rustc-demangle = "0.1"
memmap2 = "0.9"
cpp_demangle = "0.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
orbit-maps = { path = "../orbit-maps" }
orbit-object = { path = "../orbit-object" }
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
orbit-perf-records = { path = "../orbit-perf-records" }
orbit-scope-ring = { path = "../orbit-scope-ring" }
orbit-thread-states = { path = "../orbit-thread-states" }
orbit-tracing-state = { path = "../orbit-tracing-state" }
orbit-wire = { path = "../orbit-wire" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
orbit-perf-ring = { path = "../orbit-perf-ring" }
orbit-unwind = { path = "../orbit-unwind" }

# The kernel logger: scheduler, thread states and stack samples on Windows.
[target.'cfg(windows)'.dependencies]
orbit-etw = { path = "../orbit-etw" }
