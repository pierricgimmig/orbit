[package]
name = "perfr-live-chrome"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/perfr/perfr"
rust-version = "1.88"
description = "Streaming Chrome Trace Event Format ingest into 32-byte LiveEvents"

[dependencies]
flate2 = { version = "1.0", default-features = true }
perfr-live-event = { path = "../perfr-live-event" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
